<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" fill="none" role="img" aria-label="TCB Transportes">
  <defs>
    <mask id="tcbCutout">
      <rect width="460" height="120" fill="white"/>
      <!-- Recorte das janelas -->
      <rect x="152" y="24" width="38" height="22" rx="3" fill="black"/>
      <rect x="196" y="24" width="38" height="22" rx="3" fill="black"/>
      <rect x="240" y="24" width="38" height="22" rx="3" fill="black"/>
      <path d="M 126 46 L 140 24 L 148 24 L 148 46 Z" fill="black"/>
      <!-- Recorte "TCB" -->
      <text x="155" y="86" fill="black" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="10">TCB</text>
      <!-- Ponto decorativo à esquerda do T -->
      <circle cx="147" cy="78" r="4" fill="black"/>
    </mask>
  </defs>

  <!-- Linhas de velocidade (frente do veículo, lado esquerdo) -->
  <line x1="8" y1="56" x2="68" y2="56" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="22" y1="63" x2="68" y2="63" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="36" y1="70" x2="68" y2="70" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Silhueta principal da pickup com máscara -->
  <path
    mask="url(#tcbCutout)"
    fill="currentColor"
    d="
      M 72 92
      L 72 62
      C 76 52, 88 42, 100 36
      L 120 28
      L 130 22
      L 140 19
      L 148 18
      L 286 18
      C 290 18, 294 20, 296 22
      L 308 34
      L 316 48
      L 320 56
      L 324 56
      L 332 56
      L 336 60
      L 336 72
      L 340 76
      C 360 82, 400 90, 440 96
      L 440 98
      L 336 98
      L 330 98
      L 72 98
      Z
    "
  />

  <!-- Linha de base (solo) -->
  <line x1="70" y1="102" x2="442" y2="102" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</svg>
