<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 130" fill="none" role="img" aria-label="TCB Transportes">
  <defs>
    <!-- Máscara para cortar as letras TCB do corpo da pickup -->
    <mask id="tcbCutout">
      <rect width="360" height="130" fill="white"/>
      <!-- Recorte das letras TCB com fonte serif bold -->
      <text x="102" y="96" fill="black" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" letter-spacing="6">TCB</text>
    </mask>
  </defs>
  
  <!-- Silhueta da pickup de 4 portas (crew cab) -->
  <g mask="url(#tcbCutout)">
    <!-- Carroçaria superior: teto, vidros, capô -->
    <path d="M 30 100 L 30 75 L 50 75 L 55 70 L 80 70 L 85 75 L 100 75 L 105 70 L 130 70 L 135 75 L 155 75 L 160 70 L 180 70 L 185 75 L 220 75 L 230 60 L 265 60 L 280 75 L 310 75 L 320 85 L 320 100 Z" fill="currentColor"/>
    
    <!-- Carroçaria inferior: bloco sólido onde TCB fica cortado -->
    <rect x="30" y="75" width="290" height="35" fill="currentColor"/>
    
    <!-- Janelas (recortes na silhueta) -->
    <!-- Janela dianteira -->
    <rect x="235" y="65" width="26" height="18" rx="2" fill="white" opacity="0.2"/>
    <!-- Janela traseira esquerda -->
    <rect x="162" y="72" width="28" height="16" rx="1.5" fill="white" opacity="0.2"/>
    <!-- Janela traseira direita -->
    <rect x="195" y="72" width="28" height="16" rx="1.5" fill="white" opacity="0.2"/>
  </g>
  
  <!-- Linha de base (solo) -->
  <rect x="25" y="110" width="300" height="8" rx="1" fill="currentColor"/>
  
  <!-- Rodas simplificadas (opcional, decorativas) -->
  <circle cx="75" cy="110" r="8" fill="currentColor" opacity="0.4"/>
  <circle cx="280" cy="110" r="8" fill="currentColor" opacity="0.4"/>
</svg>
